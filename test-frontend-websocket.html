<!DOCTYPE html>
<html>
<head>
    <title>Frontend WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .message { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Frontend WebSocket Test</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <div id="messages"></div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <button onclick="testAuth()">Test Auth</button>
    <button onclick="testGroup()">Test Group</button>
    <button onclick="testMessage()">Test Message</button>

    <script>
        let ws = null;
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');

        function connect() {
            if (ws) return;
            
            addMessage('Connecting to WebSocket...');
            ws = new WebSocket('ws://localhost:3001');
            
            ws.onopen = () => {
                status.textContent = 'Connected';
                status.className = 'status connected';
                addMessage('✅ Connected to WebSocket');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage('📨 Received: ' + JSON.stringify(data, null, 2));
            };
            
            ws.onclose = (event) => {
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
                addMessage('❌ Disconnected: ' + event.code + ' ' + event.reason);
                ws = null;
            };
            
            ws.onerror = (error) => {
                addMessage('❌ Error: ' + error);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function testAuth() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'authenticate',
                    data: { token: 'test-token' }
                }));
                addMessage('🔐 Sent auth request');
            } else {
                addMessage('❌ WebSocket not connected');
            }
        }

        function testGroup() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'join_group',
                    data: { groupId: 'test-group-123' }
                }));
                addMessage('👥 Sent join group request');
            } else {
                addMessage('❌ WebSocket not connected');
            }
        }

        function testMessage() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'group_message',
                    data: { 
                        groupId: 'test-group-123',
                        content: 'Hello from test!',
                        messageType: 'text'
                    }
                }));
                addMessage('💬 Sent test message');
            } else {
                addMessage('❌ WebSocket not connected');
            }
        }

        function addMessage(message) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ':</strong> ' + message;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Auto-connect on page load
        window.onload = () => {
            addMessage('🚀 Page loaded, ready to test WebSocket');
        };
    </script>
</body>
</html>
